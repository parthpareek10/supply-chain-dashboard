<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIP Dashboard - Login</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#14b8a6;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:400px;width:90%;text-align:center}
.login-box h1{font-size:24px;font-weight:700;color:var(--accent);margin-bottom:8px}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;margin-bottom:16px;outline:none;transition:border-color 0.3s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:12px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.3s}
.login-box button:hover{opacity:0.9}
.error{color:#f43f5e;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="login-box">
<h1>📊 WIP Dashboard</h1>
<p>Enter password to access the dashboard</p>
<input type="password" id="pwd" placeholder="Password" autofocus>
<button onclick="checkPwd()">Login</button>
<div class="error" id="err">Incorrect password. Please try again.</div>
</div>
<script>
function checkPwd(){
var input=document.getElementById('pwd').value;
var encoded=btoa(input);
if(encoded==='dW1lc2hAMTIzMzIx'){
sessionStorage.setItem('wip_auth','true');
window.location.href='index.html';
}else{
document.getElementById('err').style.display='block';
document.getElementById('pwd').value='';
}
}
document.getElementById('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')checkPwd()});
</script>
</body>
</html>
